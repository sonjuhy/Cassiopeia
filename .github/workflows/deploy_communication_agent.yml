name: Deploy communication_agent

on:
  push:
    branches: [main]
    paths:
      - 'agents/communication_agent/**'
      - 'shared_core/**'
      - '.github/workflows/deploy_communication_agent.yml'

jobs:
  # ── 테스트 ──────────────────────────────────────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 배포 (테스트 통과 후) ────────────────────────────────────────────────────
  # 이미지는 GHCR을 거치지 않고, 서버에서 git pull 후 기존 start_comm.sh 스크립트로
  # 소스에서 직접 빌드·재시작합니다 (docker-compose 밖에서 관리되는 리스너 컨테이너).
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 서버가 Tailscale 사설망에만 연결되어 있어, 배포 스텝 전에 러너를 임시로
      # 테일넷에 조인시킵니다. Tailscale 관리콘솔 > Settings > Trust credentials 에서
      # 발급한 OAuth client id/secret을 GitHub Secrets(TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET)에
      # 등록하고, ACL에 tag:ci 를 정의해야 합니다. 잡 종료 시 노드는 자동 삭제(ephemeral)됩니다.
      # secrets.SERVER_HOST 는 서버의 테일넷 IP(100.x.x.x) 또는 MagicDNS 이름이어야 합니다.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 98
          script: |
            cd ~/Workspace/CassiopeiaProject/Cassiopeia
            git pull origin main
            bash start_comm.sh
