name: Deploy slack_agent

on:
  push:
    branches: [main]
    paths:
      - 'agents/slack_agent/**'
      - 'shared_core/**'
      - '.github/workflows/deploy_slack_agent.yml'

jobs:
  # ── 테스트 ──────────────────────────────────────────────────────────────────
  test:
    uses: ./.github/workflows/test.yml

  # ── 빌드 & 배포 (테스트 통과 후) ─────────────────────────────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./agents/slack_agent/Dockerfile.alpine
          push: true
          tags: ghcr.io/${{ github.repository }}-slack_agent:latest

      # 서버가 Tailscale 사설망에만 연결되어 있어, 배포 스텝 전에 러너를 임시로
      # 테일넷에 조인시킵니다. Tailscale 관리콘솔 > Settings > OAuth clients 에서
      # 발급한 client id/secret을 GitHub Secrets(TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET)에
      # 등록하고, ACL에 tag:ci 를 정의해야 합니다. 잡 종료 시 노드는 자동 삭제(ephemeral)됩니다.
      # 이후 secrets.SERVER_HOST 는 테일넷 IP(100.x.x.x) 또는 MagicDNS 이름이어야 합니다.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}-slack_agent:latest
            docker image prune -f
